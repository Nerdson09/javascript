<!DOCTYPE html>

<html>

<head>
    <title>Operators</title>
    <style>
        .regular { font-size: 16px; color: rgb(82, 65, 65); }
        .numbers { font-size: 20px; color: rgb(68, 165, 101); }
        .result { font-size: 24px; color: rgb(0, 255, 242); }
        body {
            font-family:'comic sans ms', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 100;
        }
    </style>
</head>

<body>
    <h1>Les operations!</h1>

   
    <div id="output"></div>
    <script>
        // Donne moi 2 nombres s'ils vous plait!
        let number1 = parseInt(window.prompt("First number!"));
        let number2 = parseInt(window.prompt("Second number!"));

        // Math ops
        let add = number1 + number2;
        let subtract = number1 - number2;
        let multiply = number1 * number2;
        let divide = number1 / number2;
        let modulo = number1 % number2;

        // Comp ops
        let equal = number1 == number2;
        let notEqual = number1 != number2;
        let lessThan = number1 < number2;
        let greaterThan = number1 > number2;
        let lessEqual = number1 <= number2;

        let output = "<h2>Arithmetic Operations</h2>";


        // Multiplication
        output += "<p>Multiplication: . " + number1 + " * " + number2 + " = " + multiply + "</p>";

               // Less than or equal
        output += "<p>Less than or equal:?" + number1 + " <= " + number2 + " is " + lessEqual + "</p>";

        // Division
        output += "<p>Division:  " + number1 + " / " + number2 + " = " + divide + "</p>";

        // Modulo
        output += "<p>Modulo: Returns the remainder of division. " + number1 + " % " + number2 + " = " + modulo + "</p>";

        output += "<h2>Comparison Operations</h2>";

        // Equal to (fancy css styling)
        output += "<p>Equal to: . <span class='numbers'>" + number1 + "</span> == <span class='numbers'>" + number2 + "</span> is <span class='result'>" + equal + "</span></p>";

        // Not equal
        output += "<p>Not equal:  " + number1 + " != " + number2 + " is " + notEqual + "</p>";

                // Addition (css styling)
        output += "<p>Addition: " + number1 + "</span> + <span class='numbers'>" + number2 + "</span> = <span class='result'>" + add + "</span></p>";

        // Subtraction
        output += "<p>Subtraction: Subtracts the second number from the first. " + number1 + " - " + number2 + " = " + subtract + "</p>";

        // Less than
        output += "<p>Less than: Checks if first number is less than second. " + number1 + " < " + number2 + " is " + lessThan + "</p>";

        // Greater than
        output += "<p>Greater than: Checks if first number is greater than second. " + number1 + " > " + number2 + " is " + greaterThan + "</p>";


        // Set the output
        document.getElementById("output").innerHTML = output; 
    </script>

</body>

</html>
