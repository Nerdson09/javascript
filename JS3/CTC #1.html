<!DOCTYPE html>
<html>
<head>
    <title>CTC 1</title>
    <script>
        function event1(){
            window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
        }
        function event2(){
            window.alert("You clicked the button!!");
        }
        function event3(){
            window.alert("You Clicked the button twice!!");
        }
        function event4(){
            window.location.href = "https://www.lttstore.ca";
        }
    </script>
</head>
<body style="background-color: cornflowerblue;">
    <div style="font-size: large; font-family:'comic sans ms', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 1000; color: white; font-size: 40px; text-align: center;">

        <input type="button" value="Never Click Me" ondblclick="event1()">
        <input type="button" value="Click Me" onclick="event2()">
        <input type="button" value="Double Click Me" ondblclick="event3()">
         <input type="button" value="LTT Store" onclick="event4()">

    </div>
</body>
</html>
