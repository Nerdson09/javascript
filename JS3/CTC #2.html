<!DOCTYPE html>
<html style="font-size: large; font-family:'comic sans ms', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 1000; color: white; font-size: 40px; text-align: center;"></html>
<head>
    <title>CTC 2</title>
      <div id="p1">
    <script> //functions for the buttons and checkbox
        function event1(){ //redirect for rickroll button
            window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
        }
        function event2(){ //single click function
            window.alert("You clicked the button!!");
        }
        function event3(){//double click function 
            window.alert("You Clicked the button twice!!");
        }
        function event4(){//Linus Tech Tips store button
            window.location.href = "https://www.lttstore.ca";
        }
        function message1(){//text box
            window.alert(document.getElementById("input1").value);
        }
        function event5(){//checkbox function
            window.alert("You Checked this box!! "); 
            
        }
        function event6(){ //all functions for the properties button
            document.body.style.backgroundImage = "url('penguin.jpg')", document.body.style.backgroundSize = "cover"; //changes the background to a penguin
            document.getElementById("p2").style.color = "grey"; //changes the color of the text
            document.title = "Properties"; //changes the title of the page
            document.getElementById("p2").style.fontSize = "900px"; //makes the text freaking massive
            document.body.style.zoom = "35%"; //zooms out the page to fit the massive text
              
        } //reloads the page to reset the properties
        function event7(){
            location.reload();
        }
        
    </script> </div>
    </head> <!--inputs for functions-->
        <body style="background-color: cornflowerblue;">
            <input type="button" value="Never Click Me" onclick="event1()">
            <input type="button" value="Click Me" onclick="event2()">
            <input type="button" value="Double Click Me" ondblclick="event3()">
            <input type="button" value="LTT Store" onclick="event4()">
            <input type="button" value="properties" onclick="event6()">
            <input type="button" value="Reset Properties" onclick="event7()">
        
         <!--checkbox for reset changes-->
    <input type="checkbox" id="checkbox1" value="reset changes" onclick="event5()">
       
 <form id="form1"> 
             <div id="p2"> Text Input </div>
        <input type="text" id="input1"> 
        <input type="button" id="button1" value="Enter" onclick="message1(this.form)" >
     </form>
</body>
</html>
