<!DOCTYPE html>
<html>
<head>
   
    <title>Random Number Generator Game</title>
   
</head>
<body style="background-color: cornflowerblue; font-family:'comic sans ms', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 1000; color: white; font-size: 40px; text-align: center;">
    
    <script>

        let number1 = parseInt(window.prompt("Min number"));
        let number2 = parseInt(window.prompt("Max number"));

        var randomNumber = Math.floor(Math.random() * (number2 - number1 + 1)) + number1;
        var attempts = 0; 
         
        function guessNumber() {
            var userGuess = parseInt(document.getElementById("guessInput").value); // gets the user's guess
            attempts++; // increments the attempt count
            
            if (userGuess === randomNumber) {
                alert("Congratulations! You've guessed the number in " + attempts + " attempts!");
                location.reload(); // resets the game after a correct guess
            } else if (userGuess < randomNumber) {
                alert("Too low! Try again.");
            } else {
                alert("Too high! Try again.");
            }
        }
        
        function resetGame() {
            randomNumber = Math.floor(Math.random() * (number2 - number1 + 1)) + number1; // generates a new random number
            attempts = 0; // resets the attempt count
            document.getElementById("guessInput").value = ""; // clears the input field
        }
    </script>
    
    <h1>Random Number Generator Guessing Game</h1>
    <input type="number" id="guessInput" min="${number1}" max="${number2}">
    <button onclick="guessNumber()">Submit Guess</button>
</body>
</html>
