<!DOCTYPE html>
<html>
<head>
    <title>Random Number Generator Game</title>
</head>
<body style="background-color: cornflowerblue; font-family:'comic sans ms', Tahoma, Geneva, Verdana, sans-serif; font-weight: 1000; color: white; font-size: 40px; text-align: center;">
    <script>
        let minValue = parseInt(window.prompt("Min number"), 10);
        let maxValue = parseInt(window.prompt("Max number"), 10);

        while (isNaN(minValue)) {
            minValue = parseInt(window.prompt("Enter a valid minimum number"), 10);
        }

        while (isNaN(maxValue) || maxValue <= minValue) {
            maxValue = parseInt(window.prompt("Enter a valid maximum number greater than " + minValue), 10);
        }

        let randomNumber = Math.floor(Math.random() * (maxValue - minValue + 1)) + minValue;
        let attempts = 0;

        window.addEventListener("DOMContentLoaded", function () {
            const guessInput = document.getElementById("guessInput");
            guessInput.min = minValue;
            guessInput.max = maxValue;
            document.getElementById("rangeText").textContent = "Guess a number between " + minValue + " and " + maxValue + ".";
        });

        function guessNumber() {
            const userGuess = parseInt(document.getElementById("guessInput").value, 10);
            if (isNaN(userGuess)) {
                alert("Please enter a valid number.");
                return;
            }

            attempts++;

            if (userGuess === randomNumber) {
                alert("Congratulations! You've guessed the number in " + attempts + " attempts!");
                location.reload();
            } else if (userGuess < randomNumber) {
                alert("Too low! Try again.");
            } else {
                alert("Too high! Try again.");
            }
        }

        function resetGame() {
            randomNumber = Math.floor(Math.random() * (maxValue - minValue + 1)) + minValue;
            attempts = 0;
            document.getElementById("guessInput").value = "";
        }
    </script>

    <h1>Random Number Generator Guessing Game</h1>
    <p id="rangeText"></p>
    <input type="number" id="guessInput">
    <button onclick="guessNumber()">Submit Guess</button>
    <button onclick="resetGame()">Reset Game</button>
</body>
</html>
