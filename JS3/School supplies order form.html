<!DOCTYPE html>
<head>
    <title>order form</title>
</head>
<body style="background-color: cornflowerblue; font-family:'comic sans ms', Tahoma, Geneva, Verdana, sans-serif; font-weight: 1000; color: white; font-size: 20px; text-align: left;">



  
    <h1>Order Form</h1>

    <script>
        function amount() {

                let Pencils= parseFloat(document.getElementById("pencils").value * 0.30)

                let Pens= parseFloat(document.getElementById("pens").value * 0.50)

                let Erasers= parseFloat(document.getElementById("erasers").value * 1.00)

                let Shipping= 2

                let Total= Pencils + Pens + Erasers

                parseFloat(document.getElementById("p1").innerHTML= Total + "$ Before Tax")

                if(Pencils+ Pens+ Erasers == 0 || null){

                    window.alert("You didn't Order Anything!")
                    
                    document.getElementById("p1").innerHTML= "Nothing was ordered"

                    return
                }


                if (document.getElementById("sk").checked){

                    let Aftertax= Total * 1.11

                    document.getElementById("p2").innerHTML= Aftertax + "$ After Tax and Shipping"

                    document.getElementById("p3").innerHTML= "Free Shipping"

                    document.getElementById("p4").innerHTML= "Is the 5$ discount Applied?: No"

                    document.getElementById("p5").innerHTML= "11% in Taxes"

                    if (Aftertax > 30){

                        Aftertax = Aftertax -5
                        document.getElementById("p2").innerHTML= Aftertax + "$ After Tax and Shipping"

                        document.getElementById("p3").innerHTML= "Free Shipping"

                        document.getElementById("p4").innerHTML= "Is the 5$ discount Applied?: Yes!"

                        document.getElementById("p5").innerHTML= "11% in Taxes"

                    }
                }

                else if (document.getElementById("ab").checked){

                    let Aftertax= (Total * 1.05)+ Shipping

                    document.getElementById("p2").innerHTML=Aftertax + "$ After Tax and Shipping"

                    document.getElementById("p3").innerHTML= Shipping + "$ in Shipping"

                    document.getElementById("p4").innerHTML= "Is the 5$ discount Applied?: No"

                    document.getElementById("p5").innerHTML= "5% in Taxes"
                }


                else if (document.getElementById("mb").checked){ 

                    let Aftertax= (Total * 1.13)+ Shipping

                    document.getElementById("p2").innerHTML=Aftertax + "$ After Tax and Shipping"

                    document.getElementById("p3").innerHTML= Shipping + "$ in Shipping"

                    document.getElementById("p4").innerHTML= "Is the 5$ discount Applied?: No"

                    document.getElementById("p5").innerHTML= "13% in Taxes"
                }

                else {
                    document.getElementById("p1").innerHTML= "Please select a shipping location"

                    window.alert("Please select a location for shipping and taxes")

                    document.getElementById("p4").innerHTML= "Is the 5$ discount Applied?: No"

                    document.getElementById("p5").innerHTML= "No Province Selected"

                    return
                }
   
            }


    </script>
      

  
    <form id="orderForm">
       
        <!-- The main form heading -->
        <h1>What do you need?</h1>
       
        <!-- Items that people can order -->
        <label for="pencils">Pencils (0.30 each):</label>
        <input type="number" id="pencils" name="pencils" min="0" value="0">
       
        <br>

        <label for="pens">Pens (0.50 each):</label>
        <input type="number" id="pens" name="pens" min="0" value="0">
       
        <br>

        <label for="erasers">Erasers (1.00 each):</label>
       
        <input type="number" id="erasers" name="erasers" min="0" value="0">
       
        <br>
        <h2>What province are you in?</h2>
       
        <input type="radio" id="sk" name="province" value="Saskatchewan">
        <label for="sk">Saskatchewan (11% tax, Free shippin!)</label>
       
        <br>

        <input type="radio" id="ab" name="province" value="Alberta">
        <label for="ab">Alberta (5% tax, $2 shipping)</label>
       
        <br>

        <input type="radio" id="mb" name="province" value="Manitoba">
 <label for="mb">Manitoba (13% tax, $2 shipping)</label>
       
        <br>

        <button type="button" id="calculateBtn">Calculate My Order</button>
   
    </form>

    
</body>
    </div>
    </html>
