<!DOCTYPE html>
<html>
<head>
    <title>CTC 2</title>
</head>
<body  style="background-color: cornflowerblue; font-size: large; font-family:'comic sans ms', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 1000; color: white; font-size: 40px; text-align: center;">

    <h2>Array loops</h2>
    
    
    <script>
         let array = [];
       array[0] = parseInt(window.prompt("Enter item 1:"));
       array[1] = parseInt(window.prompt("Enter item 2:"));
       array[2] = parseInt(window.prompt("Enter item 3:"));
       array[3] = parseInt(window.prompt("Enter item 4:"));

       window.alert("values: " + (array[0] + array[1] + array[2] + array[3]) / array.length );
       document.write("values: " + (array[0] + array[1] + array[2] + array[3]) / array.length);
       for (let i = 0; i < array.length; i++) {
           window.alert("values: " + array[i]);
       }
    </script>
</body>
</html>
